[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apache-ossie"
version = "0.2.0.dev0"
description = "Python types for the Apache Ossie semantic model specification"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "sqlglot>=25.0",
]

[project.license]
text = "Apache-2.0"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.11",
    "types-PyYAML",
    "hypothesis>=6.0",
    "import-linter>=2.0",
    "mutmut>=3.0",
]

[tool.ruff]
extend = "../../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Closed-algebra layering guard (run: `make lint-imports`). The algebra is
# the lowest compiler layer; it may depend only on ossie.common / ossie.errors
# (plus stdlib + sqlglot), never on higher layers. See
# src/ossie/algebra/ARCHITECTURE.md.
[tool.importlinter]
root_package = "ossie"

[[tool.importlinter.contracts]]
name = "algebra is a closed lower layer"
type = "forbidden"
source_modules = ["ossie.algebra"]
forbidden_modules = [
    "ossie.models",
    "ossie.parsing",
    "ossie.planning",
    "ossie.codegen",
]

# Mutation testing of the correctness core (run: `make mutation`). Opt-in and
# slow, so it is not part of pre-commit. Target: >= 90% killed.
[tool.mutmut]
paths_to_mutate = ["src/ossie/algebra/"]
