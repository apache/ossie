[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ossie-clickhouse"
version = "0.1.0"
description = "ClickHouse SQL dialect converter for Apache Ossie semantic models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_clickhouse"]
