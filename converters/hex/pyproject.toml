[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
]

[project]
name = "ossie-hex"
version = "0.2.0.dev0"
description = "Bidirectional converter between Apache Ossie semantic models and Hex projects"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "Hex",
]
dependencies = [
    "apache-ossie>=0.2.0.dev0",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "PyYAML>=6.0",
    "typing-extensions>=4.16.0",
]

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_hex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.uv]
default-groups = ["dev"]

# apache-ossie is not yet published to PyPI; resolve it from the in-repo
# package for now. Remove this block once apache-ossie is published to PyPI.
[tool.uv.sources]
apache-ossie = { path = "../../python", editable = true }