version: 0.2.0.dev0
name: Sample model
ontology:
  - concept: Person
    type: EntityType
    identify_by: [ssn]
    relationships:
      - name: ssn
        roles:
          - concept: SocialSecurityNr
        multiplicity: OneToOne
        derived_by: ['Person.earns(var_name) AND Person.ssn(var_name)']
      - name: earns
        roles:
          - concept: Salary
        multiplicity: ManyToOne
  - concept: SocialSecurityNr
    type: ValueType
    extends: [Integer]
    requires: ['0 < SocialSecurityNr AND SocialSecurityNr <= 999999999']
  - concept: Salary
    type: ValueType
    extends: [Decimal]
    requires: ['Salary > 0']