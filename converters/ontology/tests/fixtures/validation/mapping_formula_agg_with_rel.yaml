version: 0.2.0.dev0
name: Sample model with agg formula referencing a relationship
ontology:
  - concept: TotalSales
    type: ValueType
    extends: [Decimal]
  - concept: Item
    type: EntityType
    identify_by: [itemId]
    relationships:
      - name: itemId
        roles:
          - concept: Integer
        multiplicity: OneToOne
      - name: grossReturns
        roles:
          - concept: Store
          - concept: Decimal
        multiplicity: ManyToOne
      - name: weekSales
        roles:
          - concept: TotalSales
        multiplicity: ManyToOne
  - concept: Store
    type: EntityType
    identify_by: [storeId]
    relationships:
      - name: storeId
        roles:
          - concept: Integer
        multiplicity: OneToOne
ontology_mappings:
  - name: mapping
    semantic_model:
      name: sales_model
      datasets:
        - name: SALES
          source: SALES
          fields:
            - name: item_id
              expression: {}
            - name: amount
              expression: {}
    concept_mappings:
      - concept: Item
        object_mappings:
          - referent_mappings:
              - relationship: itemId
                expression: SALES.item_id
        link_mappings:
          - object_mapping:
              referent_mappings:
                - relationship: itemId
                  expression: SALES.item_id
            children:
              - relationship: weekSales
                object_mapping:
                  expression: 'SUM[SALES.amount WHERE Item.grossReturns(Store) > 0 GROUP BY SALES.item_id]'
      - concept: Store
        object_mappings:
          - referent_mappings:
              - relationship: storeId
                expression: SALES.item_id