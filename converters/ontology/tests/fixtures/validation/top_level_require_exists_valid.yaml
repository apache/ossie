version: 0.2.0.dev0
name: Sample model
requires:
  - 'EXISTS(Person.ssn(s) AND s > 0)'
ontology:
  - concept: Person
    type: EntityType
    identify_by: [ssn]
    relationships:
      - name: ssn
        roles:
          - concept: SocialSecurityNr
        multiplicity: OneToOne
  - concept: SocialSecurityNr
    type: ValueType
    extends: [Integer]