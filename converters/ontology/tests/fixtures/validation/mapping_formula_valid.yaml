version: 0.2.0.dev0
name: Sample model
ontology:
  - concept: PaymentId
    type: ValueType
    extends: [Integer]
  - concept: Amount
    type: ValueType
    extends: [Decimal]
  - concept: CashPayment
    type: EntityType
    identify_by: [paymentId]
    relationships:
      - name: paymentId
        roles:
          - concept: PaymentId
        multiplicity: OneToOne
      - name: netAmount
        roles:
          - concept: Amount
        multiplicity: ManyToOne
ontology_mappings:
  - name: mapping
    semantic_model:
      name: payments_model
      datasets:
        - name: PAYMENTS
          source: PAYMENTS
          fields:
            - name: id
              expression: {}
            - name: cashReceived
              expression: {}
            - name: change
              expression: {}
    concept_mappings:
      - concept: CashPayment
        object_mappings:
          - referent_mappings:
              - relationship: paymentId
                expression: PAYMENTS.id
        link_mappings:
          - object_mapping:
              referent_mappings:
                - relationship: paymentId
                  expression: PAYMENTS.id
            children:
              - relationship: netAmount
                object_mapping:
                  expression: PAYMENTS.cashReceived - PAYMENTS.change