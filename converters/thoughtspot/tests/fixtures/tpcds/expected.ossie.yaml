  - name: store_returns_sv
    source: SELECT sr_item_sk, sr_ticket_number, sr_return_amt AS RETURN_AMT, sr_return_quantity
      FROM tpcds.public.store_returns
    fields:
    - name: sr_item_sk
      label: sr_item_sk
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store_returns_sv::sr_item_sk]'
        - dialect: ANSI_SQL
          expression: store_returns_sv.sr_item_sk
      datatype: Integer
    - name: sr_ticket_number
      label: sr_ticket_number
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store_returns_sv::sr_ticket_number]'
        - dialect: ANSI_SQL
          expression: store_returns_sv.sr_ticket_number
      datatype: Integer
    - name: sr_return_amt
      label: sr_return_amt
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store_returns_sv::sr_return_amt]'
        - dialect: ANSI_SQL
          expression: store_returns_sv.RETURN_AMT
      datatype: Decimal
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "connection_name": "TPC-DS Snowflake", "sql_output_columns":
        {"sr_item_sk": "sr_item_sk", "sr_return_amt": "RETURN_AMT", "sr_ticket_number":
        "sr_ticket_number"}, "sql_query": "SELECT sr_item_sk, sr_ticket_number, sr_return_amt
        AS RETURN_AMT, sr_return_quantity FROM tpcds.public.store_returns", "tml_object":
        "sql_view", "tml_object_source_witness": "SELECT sr_item_sk, sr_ticket_number,
        sr_return_amt AS RETURN_AMT, sr_return_quantity FROM tpcds.public.store_returns",
        "unsurfaced_columns": [{"db_column_properties": {"data_type": "INT64"}, "name":
        "sr_return_quantity", "sql_output_column": "sr_return_quantity"}]}'
  description: TPC-DS retail semantic model used as a shared test fixture.
  relationships:
  - name: store_sales_to_date
    from: store_sales
    to: date_dim
    from_columns:
    - ss_sold_date_sk
    to_columns:
    - d_date_sk
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "cardinality": "MANY_TO_ONE", "join_shape": "referencing",
        "referencing_join": "store_sales_to_date", "type": "INNER"}'
  - name: store_sales_to_customer
    from: store_sales
    to: customer
    from_columns:
    - ss_customer_sk
    to_columns:
    - c_customer_sk
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "cardinality": "MANY_TO_ONE", "join_shape": "referencing",
        "referencing_join": "store_sales_to_customer", "type": "INNER"}'
  - name: store_sales_to_item
    from: store_sales
    to: item
    from_columns:
    - ss_item_sk
    to_columns:
    - i_item_sk
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "cardinality": "MANY_TO_ONE", "join_shape": "referencing",
        "referencing_join": "store_sales_to_item", "type": "INNER"}'
  - name: store_sales_to_store
    from: store_sales
    to: store
    from_columns:
    - ss_store_sk
    to_columns:
    - s_store_sk
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "cardinality": "MANY_TO_ONE", "join_shape": "referencing",
        "referencing_join": "store_sales_to_store", "type": "INNER"}'
  - name: store_returns_sv_to_store_sales
    from: store_returns_sv
    to: store_sales
    from_columns:
    - sr_item_sk
    - sr_ticket_number
    to_columns:
    - ss_item_sk
    - ss_ticket_number
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "cardinality": "MANY_TO_ONE", "join_shape": "inline", "type":
        "INNER"}'
  - name: store_returns_sv_to_item
    from: store_returns_sv
    to: item
    from_columns:
    - sr_item_sk
    to_columns:
    - i_item_sk
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "cardinality": "MANY_TO_ONE", "join_shape": "inline", "on_expression":
        "[store_returns_sv::sr_item_sk] = [item::i_item_sk] and [store_returns_sv::sr_return_amt]
        <= [item::i_current_price]", "on_expression_equality_witness": [["sr_item_sk"],
        ["i_item_sk"]], "residual_predicates": ["[store_returns_sv::sr_return_amt]
        <= [item::i_current_price]"], "type": "INNER"}'
  metrics:
  - name: total_sales
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: sum ( [store_sales::ss_ext_sales_price] )
  - name: total_profit
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: sum ( [store_sales::ss_net_profit] )
  - name: customer_lifetime_value
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: sum ( [store_sales::ss_ext_sales_price] ) / unique count ( [customer::c_customer_sk]
          )
  - name: sales_by_brand
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: sum ( [store_sales::ss_ext_sales_price] )
  - name: store_productivity
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: sum ( [store_sales::ss_ext_sales_price] ) / nullif ( sum ( [store::s_number_employees]
          ) , 0 )
  - name: total_return_quantity
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: sum ( [store_returns_sv::sr_return_quantity] )
    datatype: Integer
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "shape": "column_aggregation"}'
  - name: avg_price_adjustment
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: average ( [store_sales::ss_ext_sales_price] - [store_sales::ss_sales_price]
          )
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "shape": "scalar_formula_plus_aggregation"}'
  - name: profit_margin
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: '[formula_total_profit] / [formula_total_sales]'
  - name: prior_period_profit
    expression:
      dialects:
      - dialect: THOUGHTSPOT
        expression: last_value ( sum ( [store_sales::ss_net_profit] ) , query_groups
          ( ) , { [date_dim::d_date] } )
