      datatype: String
    - name: s_number_employees
      label: s_number_employees
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store::s_number_employees]'
        - dialect: ANSI_SQL
          expression: store.s_number_employees
      datatype: Integer
    - name: 'on'
      label: 'on'
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store::on]'
        - dialect: ANSI_SQL
          expression: store.on
      datatype: Boolean
