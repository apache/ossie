# Generated by running tml_to_ossie.convert() over the TML fixtures in this
# directory, then reviewed by hand against the construct mapping this
# converter implements. See test_fixtures.py.
#
# store's unique_keys derives to [s_store_sk], not [s_store_id]: TML has no
# native key-declaration syntax, so every key here comes from the join
# graph, and the only relationship that targets store joins on s_store_sk.
# That is a correct, expected divergence from a source format (such as one
# with its own native key declarations) that could declare s_store_id as a
# key independently of any join.
version: 0.2.0.dev0
semantic_model:
- name: tpcds_retail_model
  datasets:
  - name: store_sales
    source: TPCDS.PUBLIC.STORE_SALES
    primary_key: &id001
    - ss_item_sk
    - ss_ticket_number
    unique_keys:
    - *id001
    fields:
    - name: ss_sold_date_sk
      label: ss_sold_date_sk
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store_sales::ss_sold_date_sk]'
        - dialect: ANSI_SQL
          expression: store_sales.ss_sold_date_sk
      datatype: Integer
    - name: ss_item_sk
