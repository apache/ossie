      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store_sales::ss_quantity]'
        - dialect: ANSI_SQL
          expression: store_sales.ss_quantity
      datatype: Integer
    - name: ss_sales_price
      label: ss_sales_price
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store_sales::ss_sales_price]'
        - dialect: ANSI_SQL
          expression: store_sales.ss_sales_price
      datatype: Decimal
    - name: ss_ext_sales_price
      label: ss_ext_sales_price
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store_sales::ss_ext_sales_price]'
