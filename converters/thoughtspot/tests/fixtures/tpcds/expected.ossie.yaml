      datatype: String
    - name: i_current_price
      label: i_current_price
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[item::i_current_price]'
        - dialect: ANSI_SQL
          expression: item.i_current_price
      datatype: Decimal
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "connection_name": "TPC-DS Snowflake", "tml_object": "table",
        "tml_object_source_witness": "TPCDS.PUBLIC.ITEM"}'
  - name: store
    source: TPCDS.PUBLIC.STORE
    primary_key: &id005
    - s_store_sk
    unique_keys:
    - *id005
    fields:
    - name: s_store_sk
      label: s_store_sk
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store::s_store_sk]'
        - dialect: ANSI_SQL
          expression: store.s_store_sk
      datatype: Integer
    - name: s_store_id
      label: s_store_id
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store::s_store_id]'
        - dialect: ANSI_SQL
          expression: store.s_store_id
      datatype: String
    - name: s_store_name
      label: s_store_name
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store::s_store_name]'
        - dialect: ANSI_SQL
          expression: store.STORE_NM
      datatype: String
      custom_extensions:
      - vendor_name: THOUGHTSPOT
        data: '{"_v": 1, "db_column_name": "STORE_NM", "db_column_name_display_name_witness":
          "s_store_name"}'
    - name: s_city
      label: s_city
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[store::s_city]'
        - dialect: ANSI_SQL
