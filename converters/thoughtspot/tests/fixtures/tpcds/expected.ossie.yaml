    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "connection_name": "TPC-DS Snowflake", "tml_object": "table",
        "tml_object_source_witness": "TPCDS.PUBLIC.STORE_SALES", "unsurfaced_columns":
        [{"db_column_name": "ss_ticket_number", "db_column_properties": {"data_type":
        "INT64"}, "name": "ss_ticket_number"}]}'
  - name: date_dim
