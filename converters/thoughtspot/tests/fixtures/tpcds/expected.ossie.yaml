  - name: customer
    source: TPCDS.PUBLIC.CUSTOMER
    primary_key: &id003
    - c_customer_sk
    unique_keys:
    - *id003
    fields:
    - name: c_customer_sk
      label: c_customer_sk
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[customer::c_customer_sk]'
        - dialect: ANSI_SQL
          expression: customer.c_customer_sk
      datatype: Integer
    - name: c_customer_id
      label: c_customer_id
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[customer::c_customer_id]'
        - dialect: ANSI_SQL
          expression: customer.c_customer_id
      datatype: String
    - name: c_first_name
      label: c_first_name
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[customer::c_first_name]'
        - dialect: ANSI_SQL
          expression: customer.c_first_name
      datatype: String
    - name: c_last_name
      label: c_last_name
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[customer::c_last_name]'
        - dialect: ANSI_SQL
          expression: customer.c_last_name
      datatype: String
    - name: customer_full_name
      label: customer_full_name
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: concat ( concat ( [customer::c_first_name] , ' ' ) , [customer::c_last_name]
            )
    - name: c_email_address
      label: c_email_address
      expression:
        dialects:
        - dialect: THOUGHTSPOT
          expression: '[customer::c_email_address]'
        - dialect: ANSI_SQL
          expression: customer.c_email_address
      datatype: String
    custom_extensions:
    - vendor_name: THOUGHTSPOT
      data: '{"_v": 1, "connection_name": "TPC-DS Snowflake", "tml_object": "table",
        "tml_object_source_witness": "TPCDS.PUBLIC.CUSTOMER"}'
  - name: item
    source: TPCDS.PUBLIC.ITEM
    primary_key: &id004
    - i_item_sk
    unique_keys:
    - *id004
    fields:
    - name: i_item_sk
      label: i_item_sk
      expression:
