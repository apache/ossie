[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Dev/test-only: validates convert()'s output against core-spec/ossie-schema.json
    # in tests/test_tml_to_ossie.py. Guarded there by pytest.importorskip("jsonschema")
    # so its absence never fails the suite -- the package's only *runtime* dependency
    # stays PyYAML. Same dev-group placement as converters/nvidia's pyproject.toml.
    "jsonschema>=4.26.0",
]

[project]
name = "apache-ossie-thoughtspot"
version = "0.1.0"
description = "Convert between ThoughtSpot TML and the Apache Ossie semantic model"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "ThoughtSpot"
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_thoughtspot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]
