[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Dev/test-only: validates the finance Ossie documents against
    # core-spec/ossie-schema.json. The only runtime dependency stays PyYAML.
    "jsonschema>=4.18",
]

[project]
name = "apache-ossie-wisdom-semantic-view"
version = "0.1.0"
description = "One Snowflake semantic view through Apache Ossie into a WisdomAI domain export, and back"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "WisdomAI",
    "Snowflake"
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
ossie-wisdom-semantic-view = "ossie_wisdom_semantic_view.cli:main"

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_wisdom_semantic_view"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]
