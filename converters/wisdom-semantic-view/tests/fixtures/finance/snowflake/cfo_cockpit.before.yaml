name: finance_cfo_cockpit
description: Bookings and the fiscal calendar.
tables:
- name: bookings
  base_table:
    database: finance
    schema: public
    table: bookings
  primary_key:
    columns:
    - booking_id
  dimensions:
  - name: booking_id
    expr: booking_id
    data_type: NUMBER(38,0)
  - name: customer_id
    expr: customer_id
    data_type: NUMBER(38,0)
  time_dimensions:
  - name: close_date
    expr: close_date
    data_type: DATE
  facts:
  - name: amount
    expr: amount
    data_type: NUMBER(18,2)
- name: fiscal_calendar
  base_table:
    database: finance
    schema: public
    table: fiscal_calendar
  primary_key:
    columns:
    - fiscal_date
  dimensions:
  - name: fiscal_year
    expr: fiscal_year
    data_type: NUMBER(38,0)
  - name: fiscal_quarter
    expr: fiscal_quarter
    data_type: VARCHAR
  time_dimensions:
  - name: fiscal_date
    expr: fiscal_date
    data_type: DATE
relationships:
- name: bookings_to_fiscal_calendar
  left_table: bookings
  right_table: fiscal_calendar
  relationship_columns:
  - left_column: close_date
    right_column: fiscal_date
metrics:
- name: booking_amount
  description: Sum of booking amount
  expr: SUM(bookings.amount)
