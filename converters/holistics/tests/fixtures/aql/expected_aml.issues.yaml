- code: HOLISTICS_METRIC_RENDERED_AS_AQL
  severity: WARNING
  message: >-
    the metric sits on the dataset, where AML accepts only an AQL body. The ANSI_SQL expression was
    rendered as AQL: 'SUM(items.quantity) / COUNT(DISTINCT users.id)' became 'sum(items.quantity)
    / count_distinct(users.id)'
  object_ref: quantity_per_customer
  remedy: check the AQL against the Ossie SQL it came from
- code: HOLISTICS_METRIC_RENDERED_AS_AQL
  severity: WARNING
  message: >-
    the metric sits on the dataset, where AML accepts only an AQL body. The ANSI_SQL expression was
    rendered as AQL: 'ROUND(SAFE_DIVIDE(SUM(items.quantity), ABS(COUNT(users.id))), 2)' became 'round(safe_divide(sum(items.quantity),
    abs(count(users.id))), 2)'
  object_ref: rounded_ratio
  remedy: check the AQL against the Ossie SQL it came from
- code: HOLISTICS_METRIC_RENDERED_AS_AQL
  severity: WARNING
  message: >-
    the metric sits on the dataset, where AML accepts only an AQL body. The ANSI_SQL expression was
    rendered as AQL: 'SUM(items.product_id) + COUNT(users.id)' became 'sum(items.product_id) + count(users.id)'
  object_ref: untyped_total
  remedy: check the AQL against the Ossie SQL it came from
- code: HOLISTICS_UNDECLARED_COLUMN_ADDED_AS_DIMENSION
  severity: WARNING
  message: >-
    the metric reads items.sale_price, which the dataset does not declare as a field. AQL resolves
    a reference against declared fields only, so 'sale_price' is added to model 'items' as a hidden
    dimension over the column of that name
  object_ref: borrowed_column_total
  remedy: declare 'sale_price' as a field of 'items' in Ossie
- code: HOLISTICS_METRIC_RENDERED_AS_AQL
