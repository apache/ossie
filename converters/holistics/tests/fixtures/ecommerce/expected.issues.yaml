- code: HOLISTICS_AQL_NOT_TRANSLATED
  severity: INFO
  message: >-
    body is AQL, carried verbatim under HOLISTICS_AQL. A consumer that does not speak AQL can read
    and round-trip it but cannot evaluate it
  object_ref: ecommerce_orders.delivered
  remedy: evaluate through Holistics, or rewrite the body as Holistics SQL
- code: HOLISTICS_QUERY_SOURCE
  severity: WARNING
  message: >-
    a query model becomes a query in `source`, which is one string, so a consumer reads the text to
    tell it from a table reference
  object_ref: ecommerce_users
  remedy: materialise the query as a table in Holistics before converting
- code: HOLISTICS_PARAM_DROPPED
  severity: WARNING
  message: >-
    2 param(s) have no Ossie equivalent and are stashed. A body that reads one cannot be resolved
    statically
  object_ref: ecommerce_users
  remedy: supply the param value in Holistics before converting
