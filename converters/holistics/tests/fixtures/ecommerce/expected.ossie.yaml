version: 0.2.0.dev0
name: ecommerce
description: 'A marketplace model: orders, line items, products, merchants and cities.'
datasets:
- name: ecommerce_orders
  source: '`ecommerce`.`orders`'
  primary_key:
  - id
  description: One row per customer order.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Id", "type": "number"}'
  - name: user_id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: user_id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "User Id", "type": "number"}'
  - name: created_at
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: created_at
    datatype: DateTime
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Created At", "type": "datetime"}'
  - name: created_date
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: CAST(created_at AS DATE)
    datatype: Date
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Created Date", "type": "date"}'
  - name: created_month
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: DATE_TRUNC(created_at, month)
    datatype: Date
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "format": "dd LLL, yyyy", "label": "Created Month", "type":
        "date"}'
  - name: status
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: status
    datatype: String
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Status", "type": "text"}'
  - name: delivered
    expression:
      dialects:
      - dialect: HOLISTICS_AQL
        expression: ecommerce_orders.status == 'delivered'
    datatype: Boolean
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Delivered", "type": "truefalse"}'
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aml_type": "TableModel", "data_source_name": "bigquery_demo",
      "label": "Orders", "owner": "dev@ossie.apache.org", "table_name": "`ecommerce`.`orders`"}'
- name: ecommerce_users
  source: select * from `ecommerce`.`users`
  primary_key:
  - id
  description: One row per registered customer.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Id", "type": "number"}'
  - name: full_name
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: full_name
    datatype: String
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Full Name", "type": "text"}'
  - name: gender
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: gender
    datatype: String
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Gender", "type": "text"}'
  - name: birth_date
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: birth_date
    datatype: Date
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Birth Date", "type": "date"}'
  - name: age
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: extract(year from age(ecommerce_users.birth_date))
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Age", "type": "number"}'
  - name: age_bucket
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: FLOOR(ecommerce_users.age / 10)
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "hidden": true, "label": "Age Bucket", "type": "number"}'
  - name: signup_month
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: DATE_TRUNC(created_at, month)
    datatype: DateTime
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Signup Month", "type": "datetime"}'
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aml_type": "QueryModel", "data_source_name": "bigquery_demo",
      "label": "Users", "owner": "dev@ossie.apache.org", "param": [{"label": "Reporting
      Currency", "name": "reporting_currency", "type": "text"}, {"label": "Minimum
      Age", "name": "minimum_age", "type": "number"}], "persistence": {"__doc__":
      "", "__type__": "FullPersistence", "on_cascade": "rebuild", "schema": "persisted"}}'
- name: order_items
  source: '`ecommerce`.`order_items`'
  description: One row per line item on an order.
  fields:
  - name: order_id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: order_id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Order Id", "type": "number"}'
  - name: product_id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: product_id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Product Id", "type": "number"}'
  - name: quantity
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: quantity
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Quantity", "type": "number"}'
  - name: item_value
    expression:
      dialects:
      - dialect: HOLISTICS_AQL
        expression: order_items.quantity * products.price
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Item Value", "scope": "dataset", "type": "number"}'
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aml_type": "TableModel", "data_source_name": "bigquery_demo",
      "label": "Order Items", "owner": "dev@ossie.apache.org", "table_name": "`ecommerce`.`order_items`"}'
- name: products
  source: '`ecommerce`.`products`'
  primary_key:
  - id
  description: One row per sellable product.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Id", "type": "number"}'
  - name: name
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: name
    datatype: String
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Name", "type": "text"}'
  - name: merchant_id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: merchant_id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Merchant Id", "type": "number"}'
  - name: price
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: price
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "format": "#,###[$$]", "label": "Price", "type": "number"}'
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aml_type": "TableModel", "data_source_name": "bigquery_demo",
      "label": "Products", "owner": "dev@ossie.apache.org", "table_name": "`ecommerce`.`products`"}'
- name: merchants
  source: '`ecommerce`.`merchants`'
  primary_key:
  - id
  description: One row per seller on the marketplace.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Id", "type": "number"}'
  - name: name
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: name
    datatype: String
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Name", "type": "text"}'
  - name: admin_id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: admin_id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Admin Id", "type": "number"}'
  - name: city_id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: city_id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "City Id", "type": "number"}'
  - name: country_code
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: country_code
    datatype: String
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Country Code", "type": "text"}'
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aml_type": "TableModel", "data_source_name": "bigquery_demo",
      "label": "Merchants", "owner": "dev@ossie.apache.org", "table_name": "`ecommerce`.`merchants`"}'
- name: cities
  source: '`ecommerce`.`cities`'
  primary_key:
  - id
  description: One row per city a merchant can operate in.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Id", "type": "number"}'
  - name: name
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: name
    datatype: String
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Name", "type": "text"}'
  - name: country_code
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: country_code
    datatype: String
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Country Code", "type": "text"}'
  - name: in_vietnam
    expression:
      dialects:
      - dialect: HOLISTICS_AQL
        expression: cities.country_code == 'VN'
    datatype: Boolean
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "In Vietnam", "type": "truefalse"}'
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aml_type": "TableModel", "data_source_name": "bigquery_demo",
      "label": "Cities", "owner": "dev@ossie.apache.org", "table_name": "`ecommerce`.`cities`"}'
- name: reporting__calendar
  source: '`ecommerce`.`calendar`'
  primary_key:
  - date
  description: A date spine. Lives in the reporting module, so its compiled name is
    reporting::calendar.
  fields:
  - name: date
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: date
    datatype: Date
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Date", "type": "date"}'
  - name: year
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: year
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Year", "type": "number"}'
  - name: is_weekend
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: is_weekend
    datatype: Boolean
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Is Weekend", "type": "truefalse"}'
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aml_type": "TableModel", "data_source_name": "bigquery_demo",
      "fqn": "reporting::calendar", "label": "Calendar", "owner": "dev@ossie.apache.org",
      "table_name": "`ecommerce`.`calendar`"}'
- name: delivered_orders
  source: 'select {{ #ecommerce_orders.* }}

    from {{ #ecommerce_orders }}

    where {% filter(min_delivery_attempts) %} delivery_attempts {% end %}'
  primary_key:
  - id
  description: Orders that reached the customer. Derived from ecommerce_orders rather
    than from a table.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Id", "type": "number"}'
  - name: user_id
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: user_id
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "User Id", "type": "number"}'
  - name: delivery_attempts
    expression:
      dialects:
      - dialect: BIGQUERY
        expression: delivery_attempts
    datatype: Decimal
    custom_extensions:
    - vendor_name: HOLISTICS
      data: '{"_v": 1, "label": "Delivery Attempts", "type": "number"}'
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aml_type": "QueryModel", "data_source_name": "bigquery_demo",
      "label": "Delivered Orders", "owner": "dev@ossie.apache.org", "param": [{"label":
      "Minimum Delivery Attempts", "name": "min_delivery_attempts", "type": "number"}],
      "query_forms": ["model_columns", "model_relation", "filter_block"]}'
relationships:
- name: order_items_to_ecommerce_orders
  from: order_items
  to: ecommerce_orders
  from_columns:
  - order_id
  to_columns:
  - id
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "active": true, "direction": "two_way", "nullable": true, "rlp_propagation":
      "inherit", "type": "many_to_one"}'
- name: order_items_to_products
  from: order_items
  to: products
  from_columns:
  - product_id
  to_columns:
  - id
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "active": true, "direction": "two_way", "nullable": true, "rlp_propagation":
      "inherit", "type": "many_to_one"}'
- name: ecommerce_orders_to_ecommerce_users
  from: ecommerce_orders
  to: ecommerce_users
  from_columns:
  - user_id
  to_columns:
  - id
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "active": true, "direction": "two_way", "nullable": true, "rlp_propagation":
      "inherit", "type": "many_to_one"}'
- name: products_to_merchants
  from: products
  to: merchants
  from_columns:
  - merchant_id
  to_columns:
  - id
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "active": true, "direction": "one_way", "nullable": false, "rlp_propagation":
      "one_way", "type": "many_to_one"}'
- name: merchants_to_cities
  from: merchants
  to: cities
  from_columns:
  - city_id
  - country_code
  to_columns:
  - id
  - country_code
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "active": true, "direction": "two_way", "nullable": true, "rlp_propagation":
      "inherit", "type": "many_to_one"}'
- name: delivered_orders_to_ecommerce_users
  from: delivered_orders
  to: ecommerce_users
  from_columns:
  - user_id
  to_columns:
  - id
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "active": true, "direction": "two_way", "nullable": true, "rlp_propagation":
      "inherit", "type": "many_to_one", "where": {"__doc__": "", "__type__": "RelationshipFilter",
      "from": {"__doc__": "", "__type__": "Heredoc", "content": "delivered_orders.delivery_attempts
      > 0 ", "name": "aql"}, "to": {"__doc__": "", "__type__": "Heredoc", "content":
      "ecommerce_users.age > 18 ", "name": "aql"}}}'
- name: merchants_to_ecommerce_users
  from: merchants
  to: ecommerce_users
  from_columns:
  - admin_id
  to_columns:
  - id
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "active": true, "direction": "two_way", "nullable": true, "rlp_propagation":
      "inherit", "type": "one_to_one"}'
- name: ecommerce_orders_to_reporting__calendar
  from: ecommerce_orders
  to: reporting__calendar
  from_columns:
  - created_date
  to_columns:
  - date
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "active": false, "direction": "two_way", "nullable": true, "rlp_propagation":
      "inherit", "type": "many_to_one"}'
metrics:
- name: ecommerce_orders__last_created_at
  expression:
    dialects:
    - dialect: BIGQUERY
      expression: MAX(ecommerce_orders.created_at)
  datatype: DateTime
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aggregation_type": "max", "aml_name": "last_created_at", "label":
      "Last Created At", "model": "ecommerce_orders", "type": "datetime"}'
- name: ecommerce_orders__count_orders
  expression:
    dialects:
    - dialect: BIGQUERY
      expression: COUNT(id)
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aggregation_type": "count", "aml_name": "count_orders", "label":
      "Count Orders", "model": "ecommerce_orders", "type": "number"}'
- name: ecommerce_orders__delivered_orders
  expression:
    dialects:
    - dialect: HOLISTICS_AQL
      expression: count(ecommerce_orders.id) | where(ecommerce_orders.delivered)
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aggregation_type": "custom", "aml_name": "delivered_orders",
      "hidden": true, "label": "Delivered Orders", "model": "ecommerce_orders", "type":
      "number"}'
- name: ecommerce_users__count_users
  expression:
    dialects:
    - dialect: BIGQUERY
      expression: COUNT(DISTINCT id)
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aggregation_type": "count distinct", "aml_name": "count_users",
      "label": "Count Users", "model": "ecommerce_users", "type": "number"}'
- name: order_items__total_quantity
  expression:
    dialects:
    - dialect: BIGQUERY
      expression: SUM(quantity)
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aggregation_type": "sum", "aml_name": "total_quantity", "label":
      "Total Quantity", "model": "order_items", "type": "number"}'
- name: order_items__custom_total_quantity
  expression:
    dialects:
    - dialect: BIGQUERY
      expression: sum(quantity)
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aggregation_type": "custom", "aml_name": "custom_total_quantity",
      "label": "Custom Total Quantity", "model": "order_items", "type": "number"}'
- name: cities__upstream_measure
  expression:
    dialects:
    - dialect: BIGQUERY
      expression: COUNT(cities.id)
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aggregation_type": "custom", "aml_name": "upstream_measure",
      "label": "Upstream Measure", "model": "cities", "type": "number"}'
- name: cities__downstream_measure
  expression:
    dialects:
    - dialect: BIGQUERY
      expression: cities__upstream_measure + 1
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "aggregation_type": "custom", "aml_name": "downstream_measure",
      "label": "Downstream Measure", "model": "cities", "type": "number"}'
- name: total_revenue
  expression:
    dialects:
    - dialect: HOLISTICS_AQL
      expression: sum(order_items.item_value)
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "format": "#,###[$$]", "label": "Total Revenue", "type": "number"}'
- name: count_orders
  expression:
    dialects:
    - dialect: HOLISTICS_AQL
      expression: count(order_items.order_id)
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "label": "Count Orders", "type": "number"}'
- name: revenue_share_of_all_merchants
  expression:
    dialects:
    - dialect: HOLISTICS_AQL
      expression: 'sum(order_items.item_value)

        / (sum(order_items.item_value) | of_all(merchants))'
  datatype: Decimal
  custom_extensions:
  - vendor_name: HOLISTICS
    data: '{"_v": 1, "label": "Revenue Share Of All Merchants", "type": "number"}'
custom_extensions:
- vendor_name: HOLISTICS
  data: '{"_v": 1, "aml_type": "Dataset", "data_source_name": "bigquery_demo", "label":
    "Ecommerce", "match_relationships": [{"__type__": "RelationshipConfig", "active":
    true, "direction": "two_way", "nullable": true, "rel": {"__doc__": "", "__fqn__":
    "orders_in_year", "__type__": "ManyToManyRelationship", "from": {"__doc__": "",
    "__refFqn__": "ecommerce_orders", "__type__": "FieldRef", "field": "id", "model":
    "ecommerce_orders"}, "match": {"__doc__": "", "__type__": "Heredoc", "content":
    "ecommerce_orders.created_date == reporting.calendar.date ", "name": "aql"}, "name":
    "orders_in_year", "to": {"__doc__": "", "__type__": "FieldRef", "field": "date",
    "model": "reporting.calendar"}, "type": "many_to_many"}, "rlp_propagation": "inherit"}],
    "owner": "dev@ossie.apache.org"}'
