- code: HOLISTICS_METRIC_RENDERED_AS_AQL
  severity: WARNING
  message: >-
    the metric sits on the dataset, where AML accepts only an AQL body. The ANSI_SQL expression was
    rendered as AQL: 'SUM(items.quantity) / COUNT(users.id)' became 'sum(items.quantity) / count(users.id)'
  object_ref: quantity_per_customer
  remedy: check the AQL against the Ossie SQL it came from
- code: HOLISTICS_METRIC_RENDERED_AS_AQL
  severity: WARNING
  message: >-
    the metric sits on the dataset, where AML accepts only an AQL body. The ANSI_SQL expression was
    rendered as AQL: 'quantity_per_customer / 2' became 'quantity_per_customer / 2'
  object_ref: half_quantity_per_customer
  remedy: check the AQL against the Ossie SQL it came from
- code: HOLISTICS_METRIC_RENDERED_AS_AQL
  severity: WARNING
  message: >-
    the metric sits on the dataset, where AML accepts only an AQL body. The ANSI_SQL expression was
    rendered as AQL: 'items_quantity + COUNT(users.id)' became 'items.items_quantity + count(users.id)'
  object_ref: quantity_and_customers
  remedy: check the AQL against the Ossie SQL it came from
- code: HOLISTICS_METRIC_RENDERED_AS_AQL
  severity: WARNING
