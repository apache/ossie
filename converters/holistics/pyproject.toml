[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Dev/test-only: tests/test_forward.py validates the converted document
    # against core-spec/ossie-schema.json. Guarded by pytest.importorskip, so
    # the package's only runtime dependency stays PyYAML. Same dev-group
    # placement as converters/thoughtspot's pyproject.toml.
    "jsonschema>=4.26.0",
]

[project]
name = "apache-ossie-holistics"
version = "0.1.0"
description = "Convert between Holistics AML and the Apache Ossie semantic model"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "Holistics",
    "AML",
]
dependencies = [
    "PyYAML>=6.0",
    # Runtime, not dev-only, unlike the sibling converters that use sqlglot for
    # validation. ossie_to_aml needs it to tell a column apart from a keyword or a
    # date part, which is what restores the AML interpolation AQL reads to learn
    # a body's field dependencies. Without it the reverse path cannot produce
    # usable AML at all. See src/ossie_holistics/sqlrefs.py.
    "sqlglot>=30.12.0",
]

[project.scripts]
ossie-holistics = "ossie_holistics.cli:main"

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_holistics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]
