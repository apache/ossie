# An access policy carries `securityContext` templates and bare YAML dates. Neither may
# be disturbed: the templates are Cube's own interpolation, so escaping them would break
# the policy. The date is quoted here so the fixture round-trips byte-for-byte; the
# *unquoted* form is normalized to a string (see
# test_a_bare_yaml_date_is_normalized_rather_than_crashing) because PyYAML resolves it
# to a date object, which the JSON stash cannot hold.
#
# `group` needs Cube 1.7.0 or newer: it replaced `role` in cube-js/cube#11055, and an
# older Cube refuses this file. The converter reads none of this -- the block rides
# through verbatim -- so the version floor is the fixture's alone, and it is here so
# the compile gate asks about a model today's Cube accepts.
cubes:
  - name: orders
    sql_table: shop.public.orders
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: status
        sql: status
        type: string
      - name: created_at
        sql: created_at
        type: time
    measures:
      - name: count
        type: count
    access_policy:
      - group: viewer
        row_level:
          filters:
            - member: status
              operator: equals
              values:
                - completed
            - member: created_at
              operator: notInDateRange
              values:
                - '2022-01-01'
                - "{ securityContext.currentDate }"
      - group: '*'
        member_level:
          includes: '*'
          excludes:
            - status
