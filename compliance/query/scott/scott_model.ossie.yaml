# yaml-language-server: $schema=../../../core-spec/ossie-schema.json
#
# Ossie semantic model over the SCOTT schema (scott.sql), for the query
# compliance cases in ../cases/.
#
# The metrics are dataset-scoped (datasets[].metrics). Each dataset is exposed
# as a relation with the same name, and each metric is a measure column of that
# relation (relational_semantics.md, Section 3.4). All relations of the model
# are in one schema with the name of the model (Section 11.2). The cases refer
# to these relations by two-part name: scott_model.emp, scott_model.dept, and
# scott_model.salgrade.
#
# The primary_key of each dataset is the row identity of its measures
# (Section 3.2).
#
# The AVG metrics cast their argument to DOUBLE. For AVG over an exact
# numeric, the SQL standard leaves the scale of the result
# implementation-defined (../README.md, "Result semantics").
#
# The emp-to-salgrade join (e.sal BETWEEN s.losal AND s.hisal) is a range join.
# An Ossie relationship cannot express it, so a case that uses it writes the
# join in the query (Section 11.3).

version: 0.2.0.dev0
name: scott_model
description: The SCOTT schema with dataset-scoped metrics
datasets:
  - name: emp
    source: scott.emp
    primary_key: [empno]
    fields:
      - name: empno
        datatype: Integer
        expression:
          sql: empno
      - name: ename
        datatype: String
        expression:
          sql: ename
      - name: job
        datatype: String
        expression:
          sql: job
      - name: mgr
        datatype: Integer
        expression:
          sql: mgr
      - name: hiredate
        datatype: Date
        expression:
          sql: hiredate
      - name: sal
        datatype: Decimal
        expression:
          sql: sal
      - name: comm
        datatype: Decimal
        expression:
          sql: comm
      - name: deptno
        datatype: Integer
        expression:
          sql: deptno
    metrics:
      - name: sum_sal
        description: Total salary
        datatype: Decimal
        expression:
          sql: SUM(sal)
      - name: avg_sal
        description: Average salary
        datatype: Float
        expression:
          sql: AVG(CAST(sal AS DOUBLE))
      - name: emp_count
        description: Number of employees
        datatype: Integer
        expression:
          sql: COUNT(*)
      - name: comm_count
        description: Number of employees that have a commission
        datatype: Integer
        expression:
          sql: COUNT(comm)
      - name: sum_comm
        description: Total commission
        datatype: Decimal
        expression:
          sql: SUM(comm)
      - name: avg_comm
        description: Average commission, over the employees that have a commission
        datatype: Float
        expression:
          sql: AVG(CAST(comm AS DOUBLE))

  - name: dept
    source: scott.dept
    primary_key: [deptno]
    fields:
      - name: deptno
        datatype: Integer
        expression:
          sql: deptno
      - name: dname
        datatype: String
        expression:
          sql: dname
      - name: loc
        datatype: String
        expression:
          sql: loc
    metrics:
      - name: dept_count
        description: Number of departments
        datatype: Integer
        expression:
          sql: COUNT(*)

  - name: salgrade
    source: scott.salgrade
    primary_key: [grade]
    fields:
      - name: grade
        datatype: Integer
        expression:
          sql: grade
      - name: losal
        datatype: Integer
        expression:
          sql: losal
      - name: hisal
        datatype: Integer
        expression:
          sql: hisal
    metrics:
      - name: grade_count
        description: Number of salary grades
        datatype: Integer
        expression:
          sql: COUNT(*)

relationships:
  - name: emp_to_dept
    from: emp
    to: dept
    from_columns: [deptno]
    to_columns: [deptno]
  - name: emp_to_manager
    from: emp
    to: emp
    from_columns: [mgr]
    to_columns: [empno]
