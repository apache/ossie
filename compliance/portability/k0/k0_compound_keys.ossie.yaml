# K0: preserve a four-part ERP customer-sales-area identity and its join.
version: "0.2.0.dev0"
name: k0_customer_sales_area
description: Compound primary keys, an alternate key, and paired relationship columns.
datasets:
  - name: customer_sales_area
    source: erp.customer_sales_area
    primary_key: [customer, sales_org, distr_channel, division]
    unique_keys: [[area_code]]
    fields:
      - name: customer
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: customer
        datatype: String
      - name: sales_org
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: sales_org
        datatype: String
      - name: distr_channel
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: distr_channel
        datatype: String
      - name: division
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: division
        datatype: String
      - name: area_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: area_code
        datatype: String
  - name: sales
    source: erp.sales
    primary_key: [sale_id]
    fields:
      - name: sale_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: sale_id
        datatype: String
      - name: customer
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: customer
        datatype: String
      - name: sales_org
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: sales_org
        datatype: String
      - name: distr_channel
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: distr_channel
        datatype: String
      - name: division
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: division
        datatype: String
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
relationships:
  - name: sales_to_customer_sales_area
    from: sales
    to: customer_sales_area
    from_columns: [customer, sales_org, distr_channel, division]
    to_columns: [customer, sales_org, distr_channel, division]
metrics:
  - name: total_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount)
    datatype: Decimal
