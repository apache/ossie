# M5 composition through AGG: the same avg_order_value as m5_metric_ref, composed
# from two dataset-scoped base metrics with AGG(dataset.metric) instead of with
# their expressions inlined (core-spec/spec.md, Metric Scoping rule 6). AGG is an
# OSSIE_SQL_2026 construct, so this variant is tagged OSSIE_SQL_2026. NULL when
# there are no orders, as in the inlined form.
version: "0.3.0.dev0"
name: m5_sales_agg
description: "M5: a composed metric that evaluates two dataset-scoped metrics with AGG."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: amount
        datatype: Decimal
      - name: order_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: order_id
        datatype: Integer
    metrics:
      - name: total_amount
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: SUM(amount)
        datatype: Decimal
      - name: order_count
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: COUNT(order_id)
        datatype: Integer
metrics:
  - name: avg_order_value
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AGG(sales.total_amount) / NULLIF(AGG(sales.order_count), 0)
    datatype: Decimal
