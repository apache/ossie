# M5 ladder rung: metric composition. A metric expression cannot refer to other
# metrics (core-spec/spec.md, Metric Scoping; expression_language.md), so a
# composed measure in a source tool (avg_order_value = total_amount / order_count)
# is carried with its parts inlined: a ratio of two aggregates over qualified
# dataset.field references, NULL when there are no orders. The two base metrics
# stay alongside it. Single fixture.
version: "0.2.0.dev0"
name: m5_sales
description: "M5: a composed metric, with the metrics it is built from inlined."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: order_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_id
        datatype: Integer
metrics:
  - name: total_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount)
    datatype: Decimal
  - name: order_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(sales.order_id)
    datatype: Integer
  - name: avg_order_value
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount) / NULLIF(COUNT(sales.order_id), 0)
    datatype: Decimal
