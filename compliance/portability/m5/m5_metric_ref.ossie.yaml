# M5 ladder rung: metric composition, a model-scoped metric that references
# other model-scoped metrics by name (avg_order_value refers to total_amount and
# order_count), as described under Metric Scoping in core-spec/spec.md, where a
# model-scoped metric is referenced as metric_name. Single fixture.
version: "0.2.0.dev0"
name: m5_sales
description: "M5: a metric that references other metrics (composition)."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: order_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_id
        datatype: Integer
metrics:
  - name: total_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount)
    datatype: Decimal
  - name: order_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(sales.order_id)
    datatype: Integer
  - name: avg_order_value
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: total_amount / order_count
    datatype: Decimal
