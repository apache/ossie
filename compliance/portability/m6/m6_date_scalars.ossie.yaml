# M6 ladder rung: date and time scalars from the portable core (YEAR,
# DATE_TRUNC, DATEDIFF). DATEDIFF uses the spec's part-first argument order
# DATEDIFF(part, start, end). The date-part fields resolve inside their own
# dataset (sibling columns), and the DATEDIFF metric uses the qualified form.
version: "0.2.0.dev0"
name: m6_sales
description: "M6: date and time scalar functions from the portable core."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: order_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_date
        datatype: Date
      - name: ship_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: ship_date
        datatype: Date
      - name: order_year
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: YEAR(order_date)
        datatype: Integer
      - name: order_month_start
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: DATE_TRUNC('month', order_date)
        datatype: Date
metrics:
  - name: avg_fulfillment_days
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: AVG(DATEDIFF('day', sales.order_date, sales.ship_date))
    datatype: Decimal
