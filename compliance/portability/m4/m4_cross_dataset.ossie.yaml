# M4 ladder rung: two datasets and a relationship, with a metric that
# aggregates across the join. A cross-dataset metric must qualify its columns
# by dataset to be unambiguous, so this rung has a single qualified fixture
# (no bare variant: a bare column would not say which dataset it belongs to).
version: "0.2.0.dev0"
name: m4_sales
description: "M4: two datasets, a relationship, and a cross-dataset metric."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: customer_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: customer_id
        datatype: Integer
  - name: customers
    source: samples.sales.customers
    primary_key: [customer_id]
    fields:
      - name: customer_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: customer_id
        datatype: Integer
relationships:
  - name: sales_to_customer
    from: sales
    to: customers
    from_columns: [customer_id]
    to_columns: [customer_id]
metrics:
  - name: revenue_per_customer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount) / COUNT(DISTINCT customers.customer_id)
    datatype: Decimal
