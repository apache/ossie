# M8 ladder rung: ratio-to-total with a windowed aggregate and no ORDER BY, so
# NULL placement does not enter. Each row's amount over the all-rows total
# (OVER ()) and over its region's total (OVER (PARTITION BY region)), the
# "Percent of total" form in expression_language.md. The fields are window
# expressions over sibling columns of their own dataset.
version: "0.3.0.dev0"
name: m8_sales
description: "M8: ratio-to-total via a windowed aggregate (OVER (), PARTITION BY)."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: region
        datatype: String
      - name: pct_of_total
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount / SUM(amount) OVER ()
        datatype: Decimal
      - name: pct_of_region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount / SUM(amount) OVER (PARTITION BY region)
        datatype: Decimal
