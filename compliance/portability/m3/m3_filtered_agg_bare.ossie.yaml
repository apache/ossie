# M3 ladder rung: a filtered aggregate in the spec's portable form
# SUM(CASE WHEN ... THEN x END), with no ELSE: a non-matching row contributes
# NULL, so the result equals the FILTER (WHERE ...) form (expression_language.md,
# Conditional Aggregations; an ELSE 0 would count as a real row).
# Variant: BARE reference form, carried as a DATASET-SCOPED metric
# (datasets[].metrics), where core-spec/spec.md (Metric Scoping) requires the
# single-part field name. A bare name in a model-scoped metric is not valid
# since #486; the qualified primary keeps the model-scoped form.
version: "0.3.0.dev0"
name: m3_sales
description: "M3: conditional aggregation, bare reference form."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: status
        datatype: String
    metrics:
      - name: completed_amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(CASE WHEN status = 'completed' THEN amount END)
        datatype: Decimal
