# M3 ladder rung, filter-clause form: the same filtered aggregate as the CASE
# WHEN fixtures, written with the aggregate FILTER (WHERE ...) clause that
# expression_language.md makes REQUIRED. Comparing the two forms shows whether a
# converter handles the clause itself. Variant: QUALIFIED reference form, carried as primary.
version: "0.2.0.dev0"
name: m3_sales
description: "M3: conditional aggregation with the FILTER (WHERE ...) clause, qualified reference form."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: status
        datatype: String
metrics:
  - name: completed_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount) FILTER (WHERE sales.status = 'completed')
    datatype: Decimal
