version: 2
updates:
  # GitHub Actions used by all CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Go CLI
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"
    groups:
      go-modules:
        patterns:
          - "*"

  # Python projects (PEP 621 / hatchling). They pin in uv.lock, which the
  # "pip" ecosystem does not read, so they are updated as "uv" projects.
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
