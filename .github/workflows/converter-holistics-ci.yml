name: Converters Holistics CI
on:
  push:
    branches: [ "main" ]
    paths:
      - 'converters/holistics/**'
      # core-spec/** is the convention every sibling workflow adopted in #396.
      # examples/** is load-bearing here rather than merely conventional: the
      # reverse-path snapshot converts examples/tpcds_semantic_model.yaml, so an
      # edit there fails this converter's tests without touching a converter file.
      - 'core-spec/**'
      - 'examples/**'
      - '.github/workflows/converter-holistics-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'converters/holistics/**'
      - 'core-spec/**'
      - 'examples/**'
      - '.github/workflows/converter-holistics-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install the Holistics CLI
        # The tests that run `holistics aml compile` and `holistics aml validate`
        # skip without the CLI. @holistics/cli-core is the CLI's logic as one
        # bundled JavaScript file, with no native binary and no platform
        # restriction, so it runs on the runner as it does on a developer's
        # machine. @commander-js/extra-typings is imported by its `bin` script
        # and missing from its dependencies, so it is installed alongside.
        #
        # Pinned: 2.3.32 is the first version whose compiler accepts the
        # composite relationship in the ecommerce fixture.
        run: |
          npm install --no-package-lock --prefix "$RUNNER_TEMP/holistics" \
            @holistics/cli-core@2.3.32 @commander-js/extra-typings@14.0.0
          echo "$RUNNER_TEMP/holistics/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        working-directory: converters/holistics
        run: |
          uv sync

      - name: Unit Tests
        working-directory: converters/holistics
        run: |
          uv run pytest
