# Builds an unsigned source release archive from the pull request and runs the
# release verification on it, so that main always produces an archive that
# passes the Apache Trusted Releases (ATR) checks.

name: Source Release Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  source-release:
    if: github.repository_owner == 'apache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build source release archive
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)"
          echo "RELEASE=$version-incubating" >> "$GITHUB_ENV"
          dev/release/build-source-release.sh -s -o "$RUNNER_TEMP/release" "$version-incubating"
      - name: Verify source release archive
        run: dev/release/verify-release.sh -n "$RUNNER_TEMP/release" "$RELEASE"
