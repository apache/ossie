name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  check-pr-title:
    if: github.repository_owner == 'apache'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check PR title format
        run: |
          # Enforce "Area: Description" or "type(scope): description" format
          # Examples: "Converter/dbt: Add metric support", "fix(dbt): correct round-trip", "CLI: Fix plugin listing"
          PATTERN='^(Revert ")?[A-Za-z][A-Za-z0-9._+/&,()-]*( [A-Za-z0-9][A-Za-z0-9._+/&,()-]*)*: .+'
          if ! echo "$PR_TITLE" | grep -Eq "$PATTERN"; then
            echo "::error::PR title must follow 'Area: Description' or 'type(scope): description' format."
            echo ""
            echo "Examples:"
            echo "  Converter/dbt: Add metric support"
            echo "  fix(dbt): correct round-trip for PERCENTILE"
            echo "  docs(core-spec): clarify operator precedence"
            echo "  CLI: Fix plugin listing"
            echo "  Infra: Add community workflows"
            echo ""
            echo "Valid patterns: Area:, Area/sub:, type(scope):"
            exit 1
          fi
