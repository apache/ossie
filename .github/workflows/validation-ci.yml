name: Validation CI

on:
  push:
    branches: ["main"]
    paths:
      - "validation/**"
      - "python/**"
      - "core-spec/**"
      - "ontology/**"
      - "examples/flights*.yaml"
      - "examples/tpcds_semantic_model.yaml"
      - ".github/workflows/validation-ci.yml"
      - "scripts/generate-spec-types.py"
      - "scripts/generate-mcp-profile.py"
      - "docs/proposals/execute-query-mcp.md"
  pull_request:
    branches: ["main"]
    paths:
      - "validation/**"
      - "python/**"
      - "core-spec/**"
      - "ontology/**"
      - "examples/flights*.yaml"
      - "examples/tpcds_semantic_model.yaml"
      - ".github/workflows/validation-ci.yml"
      - "scripts/generate-spec-types.py"
      - "scripts/generate-mcp-profile.py"
      - "docs/proposals/execute-query-mcp.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      - name: Run duplicate-key validator tests
        run: uv run validation/test_validate.py

      - name: Run validation pytest tests
        run: uv run --with pytest --with pyyaml --with jsonschema --with sqlglot -m pytest validation/tests/

      - name: Run shared Python model tests
        run: uv run --with pytest --with jsonschema --with ./python -m pytest python/tests/

      - name: Check spec.yaml enums are in sync with ossie-schema.json
        run: uv run scripts/generate-spec-types.py --check

      - name: Check MCP profile schemas and examples are in sync
        run: uv run scripts/generate-mcp-profile.py --check

      - name: Validate canonical example
        run: uv run validation/validate.py examples/tpcds_semantic_model.yaml

      - name: Validate flights examples
        run: |
          uv run validation/validate.py examples/flights.yaml --schema ontology/ontology.json
          uv run validation/validate.py examples/flights.ontology.yaml --schema ontology/ontology.json
          uv run validation/validate.py examples/flights.semantic_model.yaml
          uv run validation/validate.py examples/flights.mapping.yaml --schema ontology/mapping.json
