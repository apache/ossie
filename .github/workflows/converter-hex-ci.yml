name: Converters Hex CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "converters/hex/**"
      - "python/**"
      - ".github/**"
  pull_request:
    branches: ["main"]
    paths:
      - "converters/hex/**"
      - "python/**"
      - ".github/**"

env:
  UV_VERSION: "0.12.9"
  PYTHON_VERSION: "3.14"
  JUST_VERSION: "1.58.0"
  JUST_SHA256: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: converters/hex
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/just.tar.gz"
          echo "$JUST_SHA256  $RUNNER_TEMP/just.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP" just
          install -Dm755 "$RUNNER_TEMP/just" "$HOME/.local/bin/just"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - name: Install uv and python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: converters/hex
      - name: Install project
        run: just setup
      - name: Run checks
        run: just check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: converters/hex
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/just.tar.gz"
          echo "$JUST_SHA256  $RUNNER_TEMP/just.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP" just
          install -Dm755 "$RUNNER_TEMP/just" "$HOME/.local/bin/just"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - name: Install uv and python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          working-directory: converters/hex
      - name: Install project
        run: just setup
      - name: Run tests
        run: just test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: converters/hex
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/just.tar.gz"
          echo "$JUST_SHA256  $RUNNER_TEMP/just.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP" just
          install -Dm755 "$RUNNER_TEMP/just" "$HOME/.local/bin/just"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - name: Install uv and python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: converters/hex
      - name: Build distribution
        run: just build
