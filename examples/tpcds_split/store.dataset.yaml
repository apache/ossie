# The store dataset of the split TPC-DS model (tpcds.semantic_model.yaml).

version: 0.3.0.dev0
dataset:
  name: store
  source: tpcds.public.store
  primary_key:
  - s_store_sk
  unique_keys:
  - - s_store_sk
  description: Store dimension with location and store attributes
  ai_context:
    synonyms:
    - stores
    - retail locations
    - branches
  fields:
  - name: s_store_sk
    expression:
      sql: s_store_sk
    dimension:
      is_time: false
    description: Surrogate key for store
    datatype: Integer
  - name: s_store_id
    expression:
      sql: s_store_id
    dimension:
      is_time: false
    description: Business key for store
    datatype: String
    ai_context:
      synonyms:
      - store ID
      - store number
  - name: s_store_name
    expression:
      sql: s_store_name
    dimension:
      is_time: false
    description: Store name
    datatype: String
    ai_context:
      synonyms:
      - store name
      - location name
  - name: s_city
    expression:
      sql: s_city
    dimension:
      is_time: false
    description: City where store is located
    datatype: String
    ai_context:
      synonyms:
      - city
      - location
  - name: s_state
    expression:
      sql: s_state
    dimension:
      is_time: false
    description: State where store is located
    datatype: String
    ai_context:
      synonyms:
      - state
      - region
  - name: s_number_employees
    expression:
      sql: s_number_employees
    description: Number of employees at the store
    datatype: Integer
    ai_context:
      synonyms:
      - employee count
      - staff size
