# The store_sales dataset of the split TPC-DS model (tpcds.semantic_model.yaml).

version: 0.3.0.dev0
dataset:
  name: store_sales
  source: tpcds.public.store_sales
  primary_key:
  - ss_item_sk
  - ss_ticket_number
  unique_keys:
  - - ss_item_sk
    - ss_ticket_number
  description: Fact table containing all store sales transactions
  ai_context:
    synonyms:
    - sales transactions
    - store purchases
    - retail sales
    - POS data
  fields:
  - name: ss_sold_date_sk
    expression:
      sql: ss_sold_date_sk
    dimension:
      is_time: false
    description: Foreign key to date dimension
    datatype: Integer
    ai_context:
      synonyms:
      - sale date
      - transaction date
  - name: ss_item_sk
    expression:
      sql: ss_item_sk
    dimension:
      is_time: false
    description: Foreign key to item dimension
    datatype: Integer
    ai_context:
      synonyms:
      - product
      - item
  - name: ss_ticket_number
    expression:
      sql: ss_ticket_number
    dimension:
      is_time: false
    description: Ticket number identifying the sales transaction
    datatype: Integer
  - name: ss_customer_sk
    expression:
      sql: ss_customer_sk
    dimension:
      is_time: false
    description: Foreign key to customer dimension
    datatype: Integer
    ai_context:
      synonyms:
      - customer
      - buyer
  - name: ss_store_sk
    expression:
      sql: ss_store_sk
    dimension:
      is_time: false
    description: Foreign key to store dimension
    datatype: Integer
    ai_context:
      synonyms:
      - store
      - location
  - name: ss_quantity
    expression:
      sql: ss_quantity
    description: Quantity of items sold
    datatype: Integer
    ai_context:
      synonyms:
      - units sold
      - quantity
  - name: ss_sales_price
    expression:
      sql: ss_sales_price
    description: Sales price per unit
    datatype: Decimal
    ai_context:
      synonyms:
      - unit price
      - price
  - name: ss_ext_sales_price
    expression:
      sql: ss_ext_sales_price
    description: Extended sales price (quantity * price)
    datatype: Decimal
    ai_context:
      synonyms:
      - total price
      - line total
  - name: ss_net_profit
    expression:
      sql: ss_net_profit
    description: Net profit from the sale
    datatype: Decimal
    ai_context:
      synonyms:
      - profit
      - margin
  metrics:
  - name: total_quantity
    expression:
      sql: SUM(ss_quantity)
    description: Total quantity sold across all store sales
    datatype: Integer
