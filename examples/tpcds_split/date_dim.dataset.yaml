# The date_dim dataset of the split TPC-DS model (tpcds.semantic_model.yaml).

version: 0.3.0.dev0
dataset:
  name: date_dim
  source: tpcds.public.date_dim
  primary_key:
  - d_date_sk
  unique_keys:
  - - d_date_sk
  description: Date dimension with calendar attributes
  ai_context:
    synonyms:
    - calendar
    - dates
    - time periods
  fields:
  - name: d_date_sk
    expression:
      sql: d_date_sk
    dimension:
      is_time: false
    description: Surrogate key for date
    datatype: Integer
  - name: d_date
    expression:
      sql: d_date
    dimension: {}
    description: Actual date value
    datatype: Date
    ai_context:
      synonyms:
      - date
      - calendar date
  - name: d_year
    expression:
      sql: d_year
    dimension:
      is_time: true
    description: Year
    datatype: Integer
    ai_context:
      synonyms:
      - year
  - name: d_quarter_name
    expression:
      sql: d_quarter_name
    dimension:
      is_time: true
    description: Quarter name (e.g., 2024Q1)
    ai_context:
      synonyms:
      - quarter
      - fiscal quarter
  - name: d_moy
    expression:
      sql: d_moy
    dimension:
      is_time: true
    description: Month of year (1-12)
    ai_context:
      synonyms:
      - month
