# TPC-DS semantic model, split across files: this model document holds the model-level
# properties and lists each dataset's own dataset document in dataset_refs.
# Resolving it gives ../tpcds_semantic_model.yaml.

version: 0.3.0.dev0
name: tpcds_retail_model
description: TPC-DS retail semantic model for sales and customer analytics
ai_context:
  instructions: Use this semantic model for retail analytics. It provides comprehensive
    sales, customer, product, and store data from the TPC-DS benchmark. The model
    supports time-based analysis, customer segmentation, product performance, and
    store operations metrics.
dataset_refs:
- name: store_sales
  iri: store_sales.dataset.yaml
- name: date_dim
  iri: date_dim.dataset.yaml
- name: customer
  iri: customer.dataset.yaml
- name: item
  iri: item.dataset.yaml
- name: store
  iri: store.dataset.yaml
relationships:
- name: store_sales_to_date
  from: store_sales
  to: date_dim
  from_columns:
  - ss_sold_date_sk
  to_columns:
  - d_date_sk
  ai_context:
    synonyms:
    - sales date relationship
    - when sale occurred
- name: store_sales_to_customer
  from: store_sales
  to: customer
  from_columns:
  - ss_customer_sk
  to_columns:
  - c_customer_sk
  ai_context:
    synonyms:
    - customer purchase relationship
    - who bought
- name: store_sales_to_item
  from: store_sales
  to: item
  from_columns:
  - ss_item_sk
  to_columns:
  - i_item_sk
  ai_context:
    synonyms:
    - product sold relationship
    - what was sold
- name: store_sales_to_store
  from: store_sales
  to: store
  from_columns:
  - ss_store_sk
  to_columns:
  - s_store_sk
  ai_context:
    synonyms:
    - store location relationship
    - where sale occurred
metrics:
- name: total_sales
  expression:
    sql: SUM(store_sales.ss_ext_sales_price)
  description: Total sales revenue across all transactions
  datatype: Decimal
  ai_context:
    synonyms:
    - total revenue
    - gross sales
    - sales amount
- name: total_profit
  expression:
    sql: SUM(store_sales.ss_net_profit)
  description: Total net profit from store sales
  datatype: Decimal
  ai_context:
    synonyms:
    - net profit
    - total earnings
    - profit
- name: customer_lifetime_value
  expression:
    sql: SUM(store_sales.ss_ext_sales_price) / COUNT(DISTINCT customer.c_customer_sk)
  description: Average lifetime sales value per customer
  datatype: Decimal
  ai_context:
    synonyms:
    - CLV
    - LTV
    - customer value
    - lifetime revenue
- name: sales_by_brand
  expression:
    sql: SUM(store_sales.ss_ext_sales_price)
  description: Total sales by brand (requires grouping by item.i_brand)
  datatype: Decimal
  ai_context:
    synonyms:
    - brand sales
    - brand performance
    - brand revenue
- name: store_productivity
  expression:
    sql: SUM(store_sales.ss_ext_sales_price) / NULLIF(SUM(store.s_number_employees),
      0)
  description: Sales per employee across stores
  datatype: Decimal
  ai_context:
    synonyms:
    - sales per employee
    - employee productivity
    - revenue per employee
- name: cumulative_sales
  expression:
    sql: SUM(SUM(store_sales.ss_ext_sales_price)) OVER (ORDER BY date_dim.d_date ROWS
      BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  description: Running total of sales revenue by date (requires grouping by date_dim.d_date)
  datatype: Decimal
  ai_context:
    synonyms:
    - running total sales
    - cumulative revenue
    - sales to date
- name: brand_rank_in_store
  expression:
    sql: RANK() OVER (PARTITION BY store.s_store_sk ORDER BY SUM(store_sales.ss_ext_sales_price)
      DESC)
  description: Rank of each brand by sales within a store, 1 = highest (requires grouping
    by store.s_store_sk and item.i_brand)
  datatype: Integer
  ai_context:
    synonyms:
    - brand ranking by store
    - top brands per store
    - store brand leaderboard
- name: monthly_sales_change
  expression:
    sql: SUM(store_sales.ss_ext_sales_price) - LAG(SUM(store_sales.ss_ext_sales_price),
      1) OVER (ORDER BY date_dim.d_year, date_dim.d_moy)
  description: Sales revenue change versus the previous month (requires grouping by
    date_dim.d_year and date_dim.d_moy)
  datatype: Decimal
  ai_context:
    synonyms:
    - month over month sales change
    - MoM sales
    - sales delta
nonportable_extensions:
- vendor_name: SALESFORCE
  data:
    tableau_workbook_id: tpcds_retail_dashboard
    einstein_enabled: true
    crm_sync:
      enabled: true
      sync_frequency: daily
      customer_mapping: customer.c_customer_id -> Account.AccountNumber
    tableau_semantics:
      published: true
      version: 0.1.1
- vendor_name: DBT
  data:
    project_name: tpcds_analytics
    models_path: models/semantic
