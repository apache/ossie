# The item dataset of the split TPC-DS model (tpcds.semantic_model.yaml).

version: 0.3.0.dev0
dataset:
  name: item
  source: tpcds.public.item
  primary_key:
  - i_item_sk
  unique_keys:
  - - i_item_sk
  description: Item/Product dimension with product attributes
  ai_context:
    synonyms:
    - products
    - items
    - merchandise
  fields:
  - name: i_item_sk
    expression:
      sql: i_item_sk
    dimension:
      is_time: false
    description: Surrogate key for item
    datatype: Integer
  - name: i_item_id
    expression:
      sql: i_item_id
    dimension:
      is_time: false
    description: Business key for item
    datatype: String
    ai_context:
      synonyms:
      - item ID
      - product ID
      - SKU
  - name: i_item_desc
    expression:
      sql: i_item_desc
    dimension:
      is_time: false
    description: Item description
    datatype: String
    ai_context:
      synonyms:
      - product description
      - item name
  - name: i_brand
    expression:
      sql: i_brand
    dimension:
      is_time: false
    description: Brand name
    datatype: String
    ai_context:
      synonyms:
      - brand
      - manufacturer
  - name: i_category
    expression:
      sql: i_category
    dimension:
      is_time: false
    description: Item category
    datatype: String
    ai_context:
      synonyms:
      - product category
      - department
  - name: i_current_price
    expression:
      sql: i_current_price
    dimension:
      is_time: false
    description: Current price of the item
    datatype: Decimal
    ai_context:
      synonyms:
      - price
      - list price
