# Generated from the GASP Standard (https://gaspwiki.com) by `npm run derive` in gasp-wiki-mcp. Do not edit; edit /standard/ and re-run.
version: 0.3.0.dev0
name: gasp_conformance_c01_cohort_nrr
description: "GASP conformance case c01_cohort_nrr: a cohort fixed at the opening of the period and followed through its events (Net Revenue Retention). The metric gasp_nrr is staged because its formula needs \"cohort\", which OSSIE_SQL_2026 cannot state; the staged dataset gasp_account_cohorts carries the compiled SQL, one row per cohort member per period, and the metric's expression sums it. Formula: (metric.mrr at period_start + metric.expansion_mrr - metric.contraction_mrr - metric.churned_mrr) / metric.mrr at period_start over cohort(field.customer_id, period_start)"
ai_context:
  instructions: Evaluate gasp_nrr for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
datasets:
  - name: revenue_event
    source: gasp.revenue_event
    description: Revenue event.
    primary_key:
      - event_id
    fields:
      - name: change_nature
