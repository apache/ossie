        data:
          kind: snapshot
          activeWhen: field.subscription_status = 'active'
  - name: gasp_account_cohorts
    source: SELECT p.period_start, p.period_end, _c.customer_id, (SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_start AND subscription_status = 'active' AND customer_id = _c.customer_id) AS opening_mrr, (SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'expansion' AND customer_id = _c.customer_id) AS expansion_mrr, (-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'contraction' AND customer_id = _c.customer_id)) AS contraction_mrr, (-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'churn' AND customer_id = _c.customer_id)) AS churned_mrr FROM gasp.period_spine p JOIN (SELECT customer_id AS customer_id, snapshot_date AS _day FROM gasp.customer WHERE customer_status = 'active') _c ON _c._day = p.period_start
    description: "Staged cohort table: one row per customer per reporting period, the customers live on the first day of the period, holding the amounts the retention metrics sum (gasp_nrr). Computed by the GASP compiled query over the period spine."
    primary_key:
      - period_start
      - customer_id
    fields:
      - name: period_start
        expression:
          sql: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          sql: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: customer_id
        expression:
          sql: customer_id
        datatype: String
        description: Customer (account) identifier. Primary business noun; CEL name
      - name: opening_mrr
        expression:
          sql: opening_mrr
        datatype: Decimal
        description: The customer's MRR on the first day of the period
      - name: expansion_mrr
        expression:
          sql: expansion_mrr
        datatype: Decimal
        description: Expansion MRR from the customer in the period
      - name: contraction_mrr
        expression:
          sql: contraction_mrr
        datatype: Decimal
        description: Contraction MRR from the customer in the period, as a positive amount
      - name: churned_mrr
        expression:
          sql: churned_mrr
        datatype: Decimal
        description: Churned MRR from the customer in the period, as a positive amount
    metrics:
      - name: gasp_nrr
        expression:
          sql: (CAST((((SUM(opening_mrr) + SUM(expansion_mrr)) - SUM(contraction_mrr)) - SUM(churned_mrr)) AS DECIMAL) / NULLIF(SUM(opening_mrr), 0))
        description: Net Revenue Retention (NRR). The percentage of revenue retained from existing customers over a period, including expansion, contraction and churn. Also known as Net Dollar Retention (NDR).
        datatype: Decimal
        ai_context:
          synonyms:
            - NRR
            - NDR
          instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/net-revenue-retention-nrr. Staged (cohort): gasp_account_cohorts holds one row per customer_id per reporting period, the customers live on its first day, so filter its period_start to one period; grouping by customer_id gives the value per customer. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
        nonportable_extensions:
          - vendor_name: GASP
            data:
              gasp_id: nrr
              gasp_version: "1"
              unit: percent
              formula: (metric.mrr at period_start + metric.expansion_mrr - metric.contraction_mrr - metric.churned_mrr) / metric.mrr at period_start over cohort(field.customer_id, period_start)
              staged: true
    nonportable_extensions:
      - vendor_name: GASP
        data:
          staged: true
          for:
            - gasp_nrr
          reason: cohort
          cohort:
            key: customer_id
            point: period_start
          source_dialect: POSTGRES
          sources:
            SNOWFLAKE: SELECT p.period_start, p.period_end, _c.customer_id, (SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_start AND subscription_status = 'active' AND customer_id = _c.customer_id) AS opening_mrr, (SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'expansion' AND customer_id = _c.customer_id) AS expansion_mrr, (-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'contraction' AND customer_id = _c.customer_id)) AS contraction_mrr, (-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'churn' AND customer_id = _c.customer_id)) AS churned_mrr FROM gasp.period_spine p JOIN (SELECT customer_id AS customer_id, snapshot_date AS _day FROM gasp.customer WHERE customer_status = 'active') _c ON _c._day = p.period_start
            BIGQUERY: SELECT p.period_start, p.period_end, _c.customer_id, (SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_start AND subscription_status = 'active' AND customer_id = _c.customer_id) AS opening_mrr, (SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'expansion' AND customer_id = _c.customer_id) AS expansion_mrr, (-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'contraction' AND customer_id = _c.customer_id)) AS contraction_mrr, (-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'churn' AND customer_id = _c.customer_id)) AS churned_mrr FROM gasp.period_spine p JOIN (SELECT customer_id AS customer_id, snapshot_date AS _day FROM gasp.customer WHERE customer_status = 'active') _c ON _c._day = p.period_start
            DATABRICKS: SELECT p.period_start, p.period_end, _c.customer_id, (SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_start AND subscription_status = 'active' AND customer_id = _c.customer_id) AS opening_mrr, (SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'expansion' AND customer_id = _c.customer_id) AS expansion_mrr, (-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'contraction' AND customer_id = _c.customer_id)) AS contraction_mrr, (-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'churn' AND customer_id = _c.customer_id)) AS churned_mrr FROM gasp.period_spine p JOIN (SELECT customer_id AS customer_id, snapshot_date AS _day FROM gasp.customer WHERE customer_status = 'active') _c ON _c._day = p.period_start
