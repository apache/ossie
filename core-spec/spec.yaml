# Apache Ossie - Core Metadata Spec (YAML Schema)
# DRAFT version - in development, schema may change before 0.2.0 is released
version: 0.2.0.dev0
#
# Goals:
# - Standardization: Establish uniform language and structure for semantic model definitions
# - Extensibility: Support domain-specific extensions while maintaining core compatibility
# - Interoperability: Enable exchange and reuse across different AI and BI applications

---
# Enumerations
# Standard enums used throughout the specification

# The `dialect` field is a free-form string, not a closed set. OSSIE_SQL_2026 is
# the only dialect this spec defines. See extensions/dialects.md.

# Supported logical data types for fields and metrics
# Auto-generated from ossie-schema.json ($defs.DataType.enum).
datatypes:
  - "String"                # Variable-length Unicode character data
  - "Integer"               # Exact integral number
  - "Decimal"               # Exact base-10 number
  - "Float"                 # Approximate floating-point number
  - "Boolean"               # Logical two-valued truth type
  - "Date"                  # Calendar date without time of day
  - "Time"                  # Time of day without a date or timezone
  - "DateTime"              # Date and time without a timezone or offset
  - "DateTimeTz"            # Instant identified using offset or timezone context
  - "Opaque"                # Known type outside the portable vocabulary

# Vendor name for custom extensions (free-form string).
# See the known-vendor catalog in extensions/vendors.md.
vendor_name: string


# Standalone documents contain exactly one model directly at the root.
# No semantic_model wrapper; include version alongside the model properties.
# The sections in this reference file describe separate schema components.
# Top-level semantic model definition
# Required: Unique identifier for the semantic model
name: string

# Optional: Human-readable description of the semantic model
description: string

# Optional: Additional context for AI tools (e.g., custom prompts, instructions)
# Can be either:
#   - A free-form string, or
#   - A structured object with optional keys:
#       instructions: string  # how AI should use this entity
#       synonyms:     []      # alternative names / terms
#       examples:     []      # sample questions or use cases
#     (additionalProperties: true, so vendors may add more keys)
ai_context: {}  # see AIContext in ossie-schema.json

# Required: Collection of logical datasets (fact and dimension tables)
# See Logical Dataset section below for detailed structure
datasets: []

# Optional: Defines how logical datasets are connected
# See Relationships section below for detailed structure
relationships: []

# Optional: Model-scoped metrics
# For aggregations that span datasets or need to be aware of cross-dataset concepts.
# Expressions reference fields by multi-part name (e.g., SUM(orders.amount)) and
# may combine fields from more than one dataset.
# Names MUST be unique across the model.
# See Metrics section below for detailed structure
metrics: []

# Optional: Vendor-specific attributes for extensibility
# Allows vendors to add custom metadata without breaking core compatibility
custom_extensions:
  - vendor_name: string  # Free-form string identifying the vendor
    data: string

---
# Logical Dataset Schema
# Represents business entities or concepts (fact and dimension tables)
# Fields are defined within the scope of a logical dataset
datasets:
  # Required: Unique identifier for the logical dataset
  - name: string

    # Required: Reference to the underlying physical table/view or query
    # Format should be either database_name.schema_name.table_name or query
    source: string

    # Optional: Dataset fields that uniquely identify rows
    # These are fields declared in the dataset, not columns of its source
    # Can be a single field or a composite of multiple fields
    # This is the preferred unique identifier for this dataset and is used in relationships to determine many-to-one or one-to-one.
    # Examples:
    # primary_key: [customer_id]            # Simple primary key
    #
    # primary_key: [order_id, line_number]  # Composite primary key
    primary_key: []  # Array of field names

    # Optional: Array of unique key definitions, each a list of dataset fields
    # These are fields declared in the dataset, not columns of its source
    # Each unique key can be a single field or a composite of multiple fields
    # Used for determining relationship type of either many-to-one or one-to-one
    # Examples:
    # unique_keys:
    #   - [field1]
    #   - [field2, field3]
    #
    # unique_keys:
    #   - [field1, field2]
    #   - [field3, field4]
    unique_keys:
      - []  # Array of field names

    # Optional: Human-readable description of the logical dataset
    description: string

    # Optional: Additional context for AI tools (e.g., synonyms, common terms)
    # Helps LLMs understand the business meaning and generate better queries
    ai_context: {}  # see AIContext in ossie-schema.json

    # Optional: Row-level calculations for grouping, filtering, and in metric expressions
    # See Fields section below for detailed structure
    fields: []

    # Optional: Dataset-scoped metrics
    # Metrics that semantically belong to this dataset, aggregating its own
    # fields at the dataset's row level. Same structure as model-scoped metrics;
    # see the Metrics section below.
    #
    # Rules (see core-spec/spec.md#metric-scoping):
    # - The expression MUST reference only this dataset's declared fields,
    #   written by single-part (unqualified) name: SUM(net_amount).
    # - It MUST NOT reference another dataset; a metric that must do so is
    #   model-scoped and belongs in the model-root metrics.
    # - Referencing a column of the source that is not a declared field is a
    #   future extension.
    # - Field names and metric names share one namespace; every name MUST be
    #   unique across the two.
    # - Referenced from outside the dataset as dataset_name.metric_name.
    metrics: []

    # Optional: Vendor-specific attributes for extensibility
    custom_extensions:
      - vendor_name: string  # Free-form string identifying the vendor
        data: string

---
# Relationship Schema
# Defines how logical datasets within this model are connected
# Represents foreign key relationships (many-to-one or one-to-one)
relationships:
  # Required: Unique identifier for the relationship
  - name: string

    # Required: The logical dataset on the many side of the relationship
    # References a logical dataset name
    from: string

    # Required: The logical dataset on the one side of the relationship
    # References a logical dataset name
    to: string

    # Required: Array of field names in the "from" dataset (foreign key fields)
    # These are fields declared in the dataset, not columns of its source
    # For simple relationships, use a single field: [field1]
    # For composite relationships, use multiple fields: [field1, field2]
    # The order of fields must correspond to the order in to_columns
    # Examples:
    #   - [customer_id]              # Simple foreign key
    #   - [order_id, line_number]    # Composite foreign key
    from_columns: []  # Array of field names

    # Required: Array of field names in the "to" dataset (primary or unique key fields)
    # These are fields declared in the dataset, not columns of its source
    # Must have the same number of fields as from_columns in corresponding order
    # Examples:
    #   - [id]                       # Simple key
    #   - [order_id, line_number]    # Composite key
    to_columns: []  # Array of field names

    # Optional: Additional context for AI tools (e.g., synonyms, business context)
    # Helps LLMs understand when and why the datasets should be joined
    ai_context: {}  # see AIContext in ossie-schema.json

    # Optional: Vendor-specific attributes for extensibility
    custom_extensions:
      - vendor_name: string  # Free-form string identifying the vendor
        data: string

---
# Fields Schema
# Represents row-level attributes that can be used for grouping, filtering, and metric expressions
fields:
  # Required: Unique identifier for the field within the logical dataset
  - name: string

    # Required: Expression definition with dialect support
    # Supports multiple SQL dialects for cross-platform compatibility
    # Each field can have expressions in different dialects for portability
    # Can be a simple column reference or a complex scalar expression
    # Identifiers refer to columns of the dataset's source, not to other fields
    # At least one of the portable `sql` or `dialects` must be present; either may stand alone
    expression:
      sql: string  # Primary, portable OSSIE_SQL_2026 form, e.g., "customer_id", "first_name || ' ' || last_name"
      dialects:
        - dialect: string  # Free-form string; OSSIE_SQL_2026 is the only dialect the spec defines
          expression: string  # SQL scalar expression, e.g., "customer_id", "first_name || ' ' || last_name", "UPPER(email)"

    # Optional: Dimension metadata
    # Indicates this field can be used as a dimension for grouping/filtering
    dimension:
      # Optional: Temporal-role marker
      # When true, consumers should treat this field as a time dimension
      # for time-series analysis and temporal filtering. This is a *role*
      # flag, independent of the field's data type. A field with
      # is_time: true may carry any datatype (e.g. Integer for a year
      # grain, String for a month name, Date/DateTime for a date column).
      #
      # Default: when unset, is_time defaults to true if datatype is one
      # of Date, Time, DateTime, DateTimeTz, and false otherwise. Set
      # is_time: false explicitly to opt a temporal-typed column out of
      # time-dimension treatment.
      is_time: boolean

    # Optional: Label for categorization (e.g., "filter")
    label: string

    # Optional: Human-readable display name for UI and AI interaction
    # Provides a user-friendly name distinct from the technical field name
    display_label: string

    # Optional: Human-readable description of the field
    description: string

    # Optional: Logical data type for this field
    # Must be one of the values from the 'datatypes' enum above.
    # Decimal is exact base-10 with unspecified precision and scale;
    # Float is approximate. Omit datatype when unknown or unspecified.
    # Use Opaque + custom_extensions for a known type outside the
    # portable vocabulary.
    datatype: string

    # Optional: Additional context for AI tools (e.g., synonyms, business terms)
    # Helps LLMs understand the field meaning and generate better queries
    ai_context: {}  # see AIContext in ossie-schema.json

    # Optional: High-level semantic classification of the field
    # Helps consumers determine appropriate visualization and handling
    # Either a well-known token OR an absolute URI (scheme required) pointing to
    # an external type system
    # Well-known tokens: categorical, quantitative, monetary, temporal, geographic, ordinal, identifier
    # URI examples: https://www.iso20022.org/glossary/LEI, https://fpml.org/types/ISIN
    semantic_type: string

    # Optional: Describes what a numeric value represents (units and measurement)
    # Enables unit-aware reasoning and formatting
    measurement:
      # Optional: The kind of quantity being measured
      # Examples: currency, length, weight, temperature, percentage, duration
      quantity_kind: string
      # Optional: The specific unit of measurement
      # For currency, use ISO 4217 codes (e.g., usd, eur, gbp); this is the
      # authoritative currency, and consumers derive the symbol from it
      # For other units, use UCUM or descriptive strings (e.g., meters, kg, celsius)
      unit: string
      # Optional: The unit system
      # Values: si, imperial, custom
      unit_system: string
      # If measurement is present, it must contain at least one of the above

    # Optional: Display format string for presentation
    # Uses Excel-compatible custom number format conventions
    # Examples: "#,##0.00", "0.0%", "#,##0", "yyyy-mm-dd"
    # A format pattern, not an expression or a named preset (e.g. "currency")
    # Locale-invariant: "." and "," are the decimal and grouping separator
    # placeholders, rendered in the viewer's locale. A literal currency symbol
    # (e.g. "$#,##0.00") renders as written; prefer measurement.unit instead
    # Consumers MAY fall back to default formatting if unsupported
    display_format: string

    # Optional: Default aggregation behavior when this field is used as a measure
    # Removes ambiguity in query generation for consumers
    # Values: sum, avg, min, max, count, count_distinct
    default_aggregation: string

    # Optional: Default sorting behavior for this field
    default_sort:
      # Optional: Sort direction
      # Values: asc, desc
      direction: string
      # Optional: Null handling
      # Values: first, last
      nulls: string
      # Optional: Sort by a different field (e.g., sort month names by month number)
      # A name, not an expression. When omitted, the sort is on this field.
      by_field: string

    # Optional: Default time granularity for temporal fields
    # Only applicable when dimension.is_time is true
    # Values: day, week, month, quarter, year
    default_time_granularity: string

    # Optional: References to external glossaries, ontologies, or standards
    # Uses SKOS-based predicates as a baseline but the predicate vocabulary is open,
    # allowing extensions to express non-positive assertions (e.g., DISTINCT_FROM)
    glossary_references:
      - target: string      # URI of the external concept (e.g., https://schema.org/MonetaryAmount)
        predicate: string   # Relationship type. SKOS baseline: exactMatch, closeMatch, broadMatch,
                            # narrowMatch, relatedMatch. Defaults to exactMatch. Vocabulary is open.
        provenance: string  # Optional: source of this reference (e.g., "manual", "FIBO 4.1", a tool name)

    # Optional: Whether this field should be hidden from consumer UIs
    # Hidden fields remain available for expressions but are not surfaced to end users
    hidden: boolean

    # Optional: Organizational grouping labels for UI presentation
    # Used to organize fields into logical folders or categories
    # A field may belong to more than one group
    group_labels:
      - string  # e.g., "Revenue", "Financial Metrics"

    # Optional: Vendor-specific attributes for extensibility
    custom_extensions:
      - vendor_name: string  # Free-form string identifying the vendor
        data: string

---
# Metrics Schema
# Quantitative measures defined on business data
# Represents key calculations like sums, averages, ratios, etc.
#
# The same structure is used in two placements:
# - the model-root metrics (model-scoped): may span datasets
# - datasets[].metrics     (dataset-scoped): must resolve within one dataset
metrics:
  # Required: Unique identifier for the metric
  - name: string

    # Required: Expression definition with dialect support
    # Supports multiple SQL dialects for cross-platform compatibility
    # Each metric can have expressions in different dialects for portability
    # References are dataset fields, not columns of the dataset's source
    # Model-scoped metrics qualify them as dataset.field; dataset-scoped
    # metrics use unqualified field names
    # Metrics cannot reference other metrics
    # At least one of the portable `sql` or `dialects` must be present; either may stand alone
    expression:
      sql: string  # Primary, portable OSSIE_SQL_2026 form, e.g., "SUM(orders.sales)", "AVG(orders.amount)"
      dialects:
        - dialect: string  # Free-form string; OSSIE_SQL_2026 is the only dialect the spec defines
          expression: string  # Full SQL expression with aggregate functions, e.g., "SUM(orders.sales)", "AVG(orders.amount)"

    # Optional: Human-readable description of the metric
    # Should explain what the metric measures and how it's used
    description: string

    # Optional: Logical data type for this metric
    # Must be one of the values from the 'datatypes' enum above.
    # Decimal is exact base-10 with unspecified precision and scale;
    # Float is approximate. Omit datatype when unknown or unspecified.
    # Use Opaque + custom_extensions for a known type outside the
    # portable vocabulary.
    datatype: string

    # Optional: Additional context for AI tools (e.g., synonyms, business context)
    # Helps LLMs understand the metric meaning and suggest it appropriately
    ai_context: {}  # see AIContext in ossie-schema.json

    # Optional: Human-readable display name for UI and AI interaction
    display_label: string

    # Optional: High-level semantic classification of the metric
    # Either a well-known token OR an absolute URI (scheme required) pointing to
    # an external type system
    # Well-known tokens: categorical, quantitative, monetary, temporal, geographic, ordinal, identifier
    semantic_type: string

    # Optional: Describes what the metric value represents (units and measurement)
    measurement:
      quantity_kind: string
      unit: string
      unit_system: string

    # Optional: Display format string for presentation
    # Uses Excel-compatible custom number format conventions
    # Locale-invariant; same rules as the field display_format above
    display_format: string

    # Optional: Indicates KPI polarity for scorecards and AI summarization
    # Values: higher_is_better, lower_is_better, neutral
    desired_direction: string

    # Optional: Default sorting behavior for this metric
    default_sort:
      direction: string  # asc, desc
      nulls: string      # first, last
      by_field: string   # Optional: name (not expression) of another field or metric to sort by

    # Optional: References to external glossaries, ontologies, or standards
    # Uses SKOS-based predicates as a baseline but the predicate vocabulary is open
    glossary_references:
      - target: string      # URI of the external concept
        predicate: string   # Relationship type (SKOS baseline, open vocabulary). Default: exactMatch
        provenance: string  # Optional: source of this reference

    # Optional: Whether this metric should be hidden from consumer UIs
    hidden: boolean

    # Optional: Organizational grouping labels for UI presentation
    # A metric may belong to more than one group
    group_labels:
      - string  # e.g., "Revenue", "Financial Metrics"

    # Optional: Vendor-specific attributes for extensibility
    custom_extensions:
      - vendor_name: string  # Free-form string identifying the vendor
        data: string
