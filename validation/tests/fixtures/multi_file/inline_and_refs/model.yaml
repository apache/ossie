version: 0.3.0.dev0
name: shop
description: A shop split across files
datasets:
- name: customers
  source: shop.public.customers
  primary_key:
  - customer_id
  fields:
  - name: customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_id
  - name: region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region
dataset_refs:
- name: orders
  iri: orders.dataset.yaml
relationships:
- name: orders_to_customers
  from: orders
  to: customers
  from_columns:
  - customer_id
  to_columns:
  - customer_id
metrics:
- name: total_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(orders.amount)
